<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Currency Exchange Rates | Unionmetal Trading</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- TradingView 核心库 -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f0f2f5;
            font-family: 'Montserrat', sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        .container-custom {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .header-bar h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            margin: 0;
            font-family: 'Oswald', sans-serif;
        }
        .currency-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .currency-selector label {
            font-weight: 500;
            color: #334155;
        }
        #currencySelect {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            min-width: 160px;
            cursor: pointer;
            font-family: inherit;
        }
        .chart-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 140px);
            min-height: 500px;
        }
        .chart-header {
            padding: 16px 20px;
            border-bottom: 1px solid #eef2f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .chart-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #0b2b3b;
            margin: 0;
        }
        .actions {
            display: flex;
            gap: 12px;
        }
        .actions button {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #5f7f9e;
            transition: color 0.2s;
        }
        .actions button:hover {
            color: #e67e22;
        }
        .chart-wrapper {
            flex: 1;
            padding: 12px;
            position: relative;
            min-height: 0;
        }
        #fxChartContainer {
            width: 100%;
            height: 100%;
        }
        .footnote {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            background: #eef2f7;
            padding: 12px;
            border-radius: 12px;
        }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .header-bar { flex-direction: column; align-items: stretch; }
            .chart-card { height: calc(100vh - 160px); }
        }
    </style>
</head>
<body>
<div class="container-custom">
    <div class="header-bar">
        <h1><i class="fas fa-chart-line" style="color: #c29d59;"></i> Currency Exchange Rates</h1>
        <div class="currency-selector">
            <label for="currencySelect">Select Currency:</label>
            <select id="currencySelect"></select>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-header">
            <h2 id="chartTitle">USD/CNY - Onshore Rate</h2>
            <div class="actions">
                <button id="fullscreenBtn" title="Toggle Fullscreen"><i class="fas fa-expand"></i></button>
                <button id="closeBtn" title="Close Window"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <div class="chart-wrapper">
            <div id="fxChartContainer"></div>
        </div>
    </div>
    <div class="footnote">
        Data provided by TradingView (delayed). Charts show real-time trends for reference only.
    </div>
</div>

<script>
function openExchangeRatePage() {
    const lang = currentLang || 'zh';
    window.open(`exchangerate.html?lang=${lang}`, '_blank', 'width=1000,height=700,resizable=yes,scrollbars=yes');
}
    // 多语言词库（币种名称翻译）
    const i18nCurrencies = {
        zh: {
            title: "Currency Exchange Graph",
            usd: "美元 USD/CNY",
            eur: "欧元 EUR/CNY",
            gbp: "英镑 GBP/CNY",
            jpy: "日元 JPY/CNY",
            aed: "迪拉姆 AED/CNY",
            ngn: "奈拉 NGN/CNY",
            cad: "加元 CAD/CNY",
            aud: "澳元 AUD/CNY",
            chf: "瑞郎 CHF/CNY",
            sgd: "新元 SGD/CNY",
            zar: "兰特 ZAR/CNY",
            mxn: "比索 MXN/CNY"
        },
        en: {
            title: "Exchange Rate Chart",
            usd: "USD/CNY",
            eur: "EUR/CNY",
            gbp: "GBP/CNY",
            jpy: "JPY/CNY",
            aed: "AED/CNY",
            ngn: "NGN/CNY",
            cad: "CAD/CNY",
            aud: "AUD/CNY",
            chf: "CHF/CNY",
            sgd: "SGD/CNY",
            zar: "ZAR/CNY",
            mxn: "MXN/CNY"
        },
        ru: {
            title: "График обменного курса",
            usd: "Доллар USD/CNY",
            eur: "Евро EUR/CNY",
            gbp: "Фунт GBP/CNY",
            jpy: "Иена JPY/CNY",
            aed: "Дирхам AED/CNY",
            ngn: "Найра NGN/CNY",
            cad: "Канадский доллар CAD/CNY",
            aud: "Австралийский доллар AUD/CNY",
            chf: "Швейцарский франк CHF/CNY",
            sgd: "Сингапурский доллар SGD/CNY",
            zar: "Рэнд ZAR/CNY",
            mxn: "Песо MXN/CNY"
        },
        fr: {
            title: "Graphique des taux de change",
            usd: "USD/CNY",
            eur: "EUR/CNY",
            gbp: "GBP/CNY",
            jpy: "JPY/CNY",
            aed: "AED/CNY",
            ngn: "NGN/CNY",
            cad: "CAD/CNY",
            aud: "AUD/CNY",
            chf: "CHF/CNY",
            sgd: "SGD/CNY",
            zar: "ZAR/CNY",
            mxn: "MXN/CNY"
        },
        ar: {
            title: "مخطط أسعار الصرف",
            usd: "دولار أمريكي USD/CNY",
            eur: "يورو EUR/CNY",
            gbp: "جنيه إسترليني GBP/CNY",
            jpy: "ين ياباني JPY/CNY",
            aed: "درهم إماراتي AED/CNY",
            ngn: "نايرا NGN/CNY",
            cad: "دولار كندي CAD/CNY",
            aud: "دولار أسترالي AUD/CNY",
            chf: "فرنك سويسري CHF/CNY",
            sgd: "دولار سنغافوري SGD/CNY",
            zar: "راند ZAR/CNY",
            mxn: "بيزو مكسيكي MXN/CNY"
        }
    };

    // 币种列表（TradingView 符号）
    const currencyList = [
        { code: "USD", symbol: "FX_IDC:USDCNY", flag: "🇺🇸" },
        { code: "EUR", symbol: "FX_IDC:EURCNY", flag: "🇪🇺" },
        { code: "GBP", symbol: "FX_IDC:GBPCNY", flag: "🇬🇧" },
        { code: "JPY", symbol: "FX_IDC:JPYCNY", flag: "🇯🇵" },
        { code: "AED", symbol: "FX_IDC:AEDCNY", flag: "🇦🇪" },
        { code: "NGN", symbol: "FX_IDC:NGNCNY", flag: "🇳🇬" },
        { code: "CAD", symbol: "FX_IDC:CADCNY", flag: "🇨🇦" },
        { code: "AUD", symbol: "FX_IDC:AUDCNY", flag: "🇦🇺" },
        { code: "CHF", symbol: "FX_IDC:CHFCNY", flag: "🇨🇭" },
        { code: "SGD", symbol: "FX_IDC:SGDCNY", flag: "🇸🇬" },
        { code: "ZAR", symbol: "FX_IDC:ZARCNY", flag: "🇿🇦" },
        { code: "MXN", symbol: "FX_IDC:MXNCNY", flag: "🇲🇽" }
    ];

    let currentLang = 'zh';  // 默认中文
    let fxWidget = null;
    let currentSymbol = "FX_IDC:USDCNY";

    // 从 URL 参数获取语言
    function getLangFromUrl() {
        const params = new URLSearchParams(window.location.search);
        const lang = params.get('lang');
        if (lang && i18nCurrencies[lang]) return lang;
        return 'zh'; // 默认中文
    }

    // 更新页面文字（标题、下拉选项）
    function updateUiText() {
        const dict = i18nCurrencies[currentLang] || i18nCurrencies.zh;
        document.getElementById('chartTitle').innerText = dict.title || "Exchange Rate Chart";
        
        const select = document.getElementById('currencySelect');
        for (let i = 0; i < select.options.length; i++) {
            const opt = select.options[i];
            const code = opt.getAttribute('data-code');
            if (code && dict[code.toLowerCase()]) {
                opt.text = dict[code.toLowerCase()];
            }
        }
    }

    // 构建币种下拉框
    function buildCurrencySelect() {
        const select = document.getElementById('currencySelect');
        select.innerHTML = '';
        currencyList.forEach(curr => {
            const option = document.createElement('option');
            option.value = curr.symbol;
            option.setAttribute('data-code', curr.code);
            option.text = `${curr.flag} ${curr.code}/CNY`; // 临时占位
            if (curr.symbol === currentSymbol) option.selected = true;
            select.appendChild(option);
        });
        updateUiText(); // 应用翻译
    }

    // 初始化/重建图表
    function initFxChart(symbol, lang) {
        const container = document.getElementById('fxChartContainer');
        if (!container) return;
        if (fxWidget && typeof fxWidget.destroy === 'function') {
            fxWidget.destroy();
            fxWidget = null;
        }
        container.innerHTML = '';
        const localeMap = { zh: 'zh', en: 'en', ru: 'ru', fr: 'fr', ar: 'ar' };
        const tvLocale = localeMap[lang] || 'en';
        fxWidget = new TradingView.widget({
            container_id: "fxChartContainer",
            width: "100%",
            height: "100%",
            symbol: symbol,
            interval: "D",
            timezone: "Asia/Shanghai",
            theme: "light",
            style: "3",
            locale: tvLocale,
            toolbar_bg: "#f1f3f6",
            enable_publishing: false,
            allow_symbol_change: false,
            hide_top_toolbar: false,
            hide_side_toolbar: false,
            save_image: false,
            studies: [],
            show_popup_button: false,
            details: true,
            hotlist: false,
            calendar: false,
            news: [],
            withdateranges: true,
            range: "12M"
        });
    }

    // 币种切换事件
    function onCurrencyChange() {
        const select = document.getElementById('currencySelect');
        const newSymbol = select.value;
        if (newSymbol === currentSymbol) return;
        currentSymbol = newSymbol;
        initFxChart(currentSymbol, currentLang);
    }

    // 全屏切换
    function toggleFullscreen() {
        const elem = document.documentElement;
        if (!document.fullscreenElement) {
            elem.requestFullscreen().catch(err => console.log(err));
        } else {
            document.exitFullscreen();
        }
    }

    // 关闭窗口（仅当此页面以弹窗形式打开时有效）
    function closeWindow() {
        if (window.opener) {
            window.close();
        } else {
            alert("This window was not opened by a script; please close manually.");
        }
    }

    // 页面加载
    window.addEventListener('DOMContentLoaded', () => {
        currentLang = getLangFromUrl();
        buildCurrencySelect();
        initFxChart(currentSymbol, currentLang);

        // 绑定事件
        const select = document.getElementById('currencySelect');
        if (select) select.addEventListener('change', onCurrencyChange);
        const fullBtn = document.getElementById('fullscreenBtn');
        if (fullBtn) fullBtn.addEventListener('click', toggleFullscreen);
        const closeBtn = document.getElementById('closeBtn');
        if (closeBtn) closeBtn.addEventListener('click', closeWindow);
    });
</script>
</body>
</html>
